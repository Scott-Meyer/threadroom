<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><style>
*{box-sizing:border-box}body{margin:0;padding:15px;background:#21243f;color:#f0eee6;font:12px system-ui,sans-serif}h1{font:23px Georgia,serif;margin:0 0 5px}p{margin:0 0 9px;font-size:11px;color:#b8bfd8}.study{display:grid;grid-template-columns:1.5fr 1fr;gap:11px}#questionImage{width:100%;height:175px;object-fit:cover;border-radius:9px;background:#161c32}.choices{display:grid;gap:5px}.card{display:flex;align-items:center;gap:9px;text-align:left;cursor:pointer;background:#2d3354;color:#f0eee6;border:2px solid transparent;border-radius:7px;padding:3px 7px}.card[aria-pressed=true]{border-color:#f3c36f;background:#414560}.card img{width:65px;height:43px;object-fit:contain}.card small{display:block;color:#b8bfd8;font-size:9px;margin-top:2px}.card:focus-visible,button:focus-visible{outline:3px solid #8cdddd;outline-offset:2px}textarea{font:inherit;display:block;width:100%;height:35px;background:#292e4b;color:white;border:1px solid #646b91;border-radius:5px;margin:4px 0 7px;padding:6px}label{display:block;color:#c3c8dc;font-size:10px;margin-top:7px}.bottom{display:flex;align-items:center;gap:9px;font-size:10px}#propose{border:0;background:#f3c36f;color:#252b40;font-weight:700;padding:7px 11px;border-radius:5px;cursor:pointer}#status{color:#c6d4d3}footer{font-size:9px;color:#b8bfd8;margin-top:5px}@media(max-width:460px){.study{grid-template-columns:1fr 1fr}.card img{width:40px}.card{gap:4px;font-size:10px}}
</style></head><body><h1>A picture asking for a picture</h1><p>TEST · Which lamp belongs in this floating garden? Pick an image, then tell us why—or answer in text instead.</p><div class="study"><img id="questionImage" alt="Question picture: a moonlit floating garden, with an empty glowing plinth waiting for a lamp"><div class="choices"><button class="card" data-id="orb" aria-pressed="false"><img id="orbImage" alt="Choice A: warm round amber lamp"><span>Amber orb<small>soft / familiar</small></span></button><button class="card" data-id="prism" aria-pressed="false"><img id="prismImage" alt="Choice B: cool geometric cyan prism lamp"><span>Cyan prism<small>sharp / curious</small></span></button><button class="card" data-id="bloom" aria-pressed="false"><img id="bloomImage" alt="Choice C: pink petal-shaped lamp"><span>Coral bloom<small>organic / playful</small></span></button></div></div><label for="notes">Optional picture notes</label><textarea id="notes" maxlength="1500" placeholder="What works here? You can also describe a fourth option."></textarea><div class="bottom"><button id="propose">Propose image choice ↓</button><span id="status" role="status">No image selected.</span></div><footer>This only proposes a draft. Threadroom's independent text / reject / Save controls stay below.</footer><script>
const svg=(content,w=120,h=80)=>'<svg xmlns="http://www.w3.org/2000/svg" width="'+w+'" height="'+h+'" viewBox="0 0 '+w+' '+h+'">'+content+'</svg>';
const data=s=>'data:image/svg+xml;charset=utf-8,'+encodeURIComponent(s);
const lamps={
 orb:{label:'Amber orb',svg:svg('<ellipse cx="60" cy="69" rx="31" ry="5" fill="#161c32"/><path d="M53 57h14l5 11H48z" fill="#98a5bd"/><circle cx="60" cy="31" r="25" fill="#ad7836" opacity=".2"/><circle cx="60" cy="31" r="18" fill="#f6c668"/><circle cx="55" cy="25" r="6" fill="#fff4cf" opacity=".8"/>')},
 prism:{label:'Cyan prism',svg:svg('<ellipse cx="60" cy="69" rx="31" ry="5" fill="#161c32"/><path d="M53 57h14l5 11H48z" fill="#98a5bd"/><path d="m60 7 27 25-27 28-27-28z" fill="#78d9df"/><path d="m60 7v53L33 32z" fill="#468da8"/><path d="m60 7 27 25H60z" fill="#bff2ed"/>')},
 bloom:{label:'Coral bloom',svg:svg('<ellipse cx="60" cy="69" rx="31" ry="5" fill="#161c32"/><path d="M57 40h6v27h-6z" fill="#7db099"/><ellipse cx="43" cy="44" rx="14" ry="6" fill="#86bca3" transform="rotate(20 43 44)"/><ellipse cx="74" cy="49" rx="14" ry="6" fill="#86bca3" transform="rotate(-20 74 49)"/><g fill="#ef94a6"><ellipse cx="60" cy="19" rx="10" ry="15"/><ellipse cx="46" cy="29" rx="15" ry="10"/><ellipse cx="74" cy="29" rx="15" ry="10"/></g><circle cx="60" cy="29" r="10" fill="#ffe09c"/>')}
};
const scene=svg('<defs><linearGradient id="sky" x2="0" y2="1"><stop stop-color="#242442"/><stop offset="1" stop-color="#465575"/></linearGradient></defs><rect width="400" height="215" fill="url(#sky)"/><g fill="#d7e1e8"><circle cx="39" cy="36" r="1"/><circle cx="89" cy="23" r="2"/><circle cx="280" cy="30" r="1"/><circle cx="360" cy="60" r="2"/><circle cx="184" cy="47" r="1"/></g><circle cx="325" cy="47" r="22" fill="#f6e5bf"/><path d="M31 147 113 129 236 137 362 126 337 156 95 173z" fill="#8fa59d"/><path d="m66 158 54 51 66-42 64 29 91-53z" fill="#5c6479"/><g stroke="#354c56" stroke-width="6"><path d="m102 139-5-57m13 24-13-18m-15 15 14-12m192 43 5-51m-1 13 14-10"/></g><g fill="#829d94"><circle cx="91" cy="75" r="25"/><circle cx="109" cy="82" r="20"/><circle cx="294" cy="82" r="18"/></g><ellipse cx="220" cy="140" rx="40" ry="12" fill="#efd397" opacity=".2"/><path d="m202 127 24-3 14 9-27 6z" fill="#ebe3ce"/><path d="m213 139 27-6v15l-27 7z" fill="#a8b2bc"/><text x="20" y="196" font-family="system-ui" font-size="11" fill="#e8e8dc">An empty plinth. Which light belongs here?</text>',400,215);
document.getElementById('questionImage').src=data(scene);for(const [id,choice]of Object.entries(lamps))document.getElementById(id+'Image').src=data(choice.svg);
let selected=null;let lastProposal=null;document.getElementById('notes').addEventListener('input',()=>{if(!lastProposal)return;const values={...lastProposal.values,notes:document.getElementById('notes').value};try{window.Threadroom.propose(values,lastProposal.summary);lastProposal={...lastProposal,values};document.getElementById('status').textContent='Notes updated in your proposed draft. Save below.'}catch(error){document.getElementById('status').textContent='Notes not proposed: '+error.message+' Use the host text field below.'}});document.querySelectorAll('.card').forEach(button=>button.onclick=()=>{selected=button.dataset.id;document.querySelectorAll('.card').forEach(b=>b.setAttribute('aria-pressed',String(b===button)));document.getElementById('status').textContent=lamps[selected].label+' selected, not submitted.'});
document.getElementById('propose').onclick=()=>{if(!selected){document.getElementById('status').textContent='Choose a picture, or answer entirely in text below.';return}const choice=lamps[selected],notes=document.getElementById('notes').value;const values={id:selected,label:choice.label,image:data(choice.svg),questionImage:data(scene),notes};const summary=choice.label;window.Threadroom.propose(values,summary);lastProposal={values,summary};document.getElementById('status').textContent='Image proposed. Add text and Save below.'};
</script></body></html>
